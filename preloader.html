<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NVZC_Preloader</title>
    <link rel="stylesheet" href="style_sheets/style.css" />
    <script defer src="javascripts/preloader.js"></script>
  </head>
  <body>
    <main id="preloader">
      <div class="start-plus">
        <div class="click-line top-line"></div>
        <div class="click-line right-line"></div>
        <div class="click-line bottom-line"></div>
        <div class="click-line left-line"></div>

        <div class="cell">
          <img class="plus1" src="images/plus1.png" alt="" />
          <img class="plus2" src="images/plus2.png" alt="" />
        </div>
        <div class="cell1">
          <img class="plus2" src="images/plus1.png" alt="" />
          <img class="plus1" src="images/plus2.png" alt="" />
        </div>
        <div class="empty-cell"></div>
      </div>
    </main>
  </body>
</html>
